type Profile {
  id: ID!
  name: String!
  description: String
  links: [String!]
  skills: [Skill!]
  experience: [Experience!]
  projects: [Project!]
}
type Skill {
  id: ID!
  name: String!
}
type Experience {
  id: ID!
  company: String!
  position: String!
}
type Project {
  id: ID!
  name: String!
  link: String!
}

type Query {
  profile(profileId: ID!): Profile
}
